sentence=Generic Interface to Teensy Timers
paragraph=TeensyTimerTool provides a common, easy to use interface to the hardware timers (GPT, TMR, PIT, RTC, FTM) of the PJRC Teensy boards and to up to 20 software timers that use the same interface. All timers can be used as periodic or one-shot timers; periods in microseconds or as std::chrono durations, callbacks as functions, lambdas or functors. Supports Teensy 4.0, 4.1, MicroMod, 3.0-3.6 and LC. Documentation: https://luni64.github.io/TeensyTimerTool/
